[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid


; ============================================================
; PostgreSQL
; ============================================================

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; Redis
; ============================================================

[program:redis]
command=/usr/bin/redis-server --bind 0.0.0.0 --appendonly yes
user=redis
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; Qdrant
; ============================================================

[program:qdrant]
command=/usr/local/bin/qdrant
user=root
priority=30
autostart=true
autorestart=true
environment=QDRANT__STORAGE__STORAGE_PATH="/var/lib/qdrant"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; Ollama
; ============================================================

[program:ollama]
command=/usr/local/bin/ollama serve
user=root
priority=40
autostart=true
autorestart=true
startsecs=5
environment=OLLAMA_HOST="0.0.0.0:11434",OLLAMA_MODELS="/var/lib/ollama"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; API
; ============================================================

[program:api]
directory=/app/api
command=bash -c "until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done && until redis-cli ping | grep -q PONG; do sleep 2; done && until curl -sf http://localhost:6333 >/dev/null; do sleep 2; done && until curl -sf http://localhost:11434/api/tags >/dev/null; do sleep 2; done && until ollama list | grep -q ${OLLAMA_MODEL:-qwen2}; do sleep 2; done && poetry run alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
user=root
priority=50
autostart=true
autorestart=true
startsecs=5
environment=PYTHONUNBUFFERED="1",DATABASE_URL="postgresql://postgres:postgres@localhost:5432/mentorai",REDIS_URL="redis://localhost:6379",QDRANT_URL="http://localhost:6333",LLM_BASE_URL="http://localhost:11434"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ============================================================
; Frontend
; ============================================================

[program:frontend]
directory=/app/frontend
command=node server.js
user=root
priority=60
autostart=true
autorestart=true
startsecs=5
environment=PORT="3000",HOSTNAME="0.0.0.0",NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
