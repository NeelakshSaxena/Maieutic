<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 2A Evaluation Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(20, 20, 25, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #00f0ff;
            --accent-purple: #8a2be2;
            --text-main: #f0f0f0;
            --text-muted: #888;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.03), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(138, 43, 226, 0.05), transparent 25%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5em;
            margin-bottom: 5px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 1.1em;
            letter-spacing: 1px;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-blue), transparent);
        }

        .stat-label {
            font-size: 0.85em;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: 600;
            color: #fff;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
            width: 0%;
            transition: width 0.5s ease-in-out;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        .terminal {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
            line-height: 1.5;
            color: #ccc;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .terminal::-webkit-scrollbar {
            width: 8px;
        }
        .terminal::-webkit-scrollbar-track {
            background: #111;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        .terminal::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .log-line { margin: 0; white-space: pre-wrap; }
        
        /* Syntax highlighting for logs */
        .log-info { color: #888; }
        .log-highlight { color: var(--accent-blue); font-weight: bold; }
        .log-phase { color: var(--accent-purple); font-weight: bold; }
        .log-error { color: #ff3366; }

        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px var(--accent-blue);
            animation: pulse-anim 2s infinite;
        }

        @keyframes pulse-anim {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 15px var(--accent-blue); }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1><span class="pulse"></span> MentorAI Evaluation Center</h1>
    <div class="subtitle">Phase 2A Real-Time Behavioral Benchmarking</div>

    <div class="glass-panel">
        <div class="status-grid">
            <div class="stat-card">
                <span class="stat-label">Current Phase</span>
                <span class="stat-value" id="current-phase">Connecting...</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Active Model</span>
                <span class="stat-value" id="active-model">-</span>
            </div>
            <div class="stat-card" style="grid-column: 1 / -1;">
                <span class="stat-label">Total Progress <span id="progress-text" style="float: right;">0%</span></span>
                <span class="stat-value" id="phase-detail" style="font-size: 1em; color: var(--accent-blue);">Initializing</span>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="glass-panel" style="padding: 15px;">
        <div style="padding: 0 10px 15px 10px;">
            <span class="stat-label" style="display: inline-block; margin: 0;">Live System Terminal</span>
            <span style="float: right; font-size: 0.8em; color: var(--text-muted);">Auto-scrolling</span>
        </div>
        <div class="terminal" id="terminal">
            <div class="log-line log-info">Establishing secure connection to evaluation daemon...</div>
        </div>
    </div>
</div>

<script>
    const terminal = document.getElementById('terminal');
    let autoScroll = true;

    terminal.addEventListener('scroll', () => {
        // Stop auto scroll if user scrolls up
        if (terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight > 20) {
            autoScroll = false;
        } else {
            autoScroll = true;
        }
    });

    function formatLogLine(line) {
        if (line.includes('[PHASE')) return `<span class="log-phase">${line}</span>`;
        if (line.includes('Generating') || line.includes('Judging')) return `<span class="log-highlight">${line}</span>`;
        if (line.toLowerCase().includes('error')) return `<span class="log-error">${line}</span>`;
        return `<span>${line}</span>`;
    }

    async function fetchProgress() {
        try {
            const res = await fetch('/api/progress');
            const data = await res.json();
            
            document.getElementById('current-phase').innerText = data.current_phase || '-';
            document.getElementById('active-model').innerText = data.active_model || '-';
            document.getElementById('phase-detail').innerText = data.detail || '';
            document.getElementById('progress-bar').style.width = `${data.progress_percent || 0}%`;
            document.getElementById('progress-text').innerText = `${data.progress_percent || 0}%`;
        } catch (e) {
            console.error('Failed to fetch progress');
        }
    }

    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs');
            const data = await res.json();
            
            if (data.lines) {
                terminal.innerHTML = data.lines.map(line => `<div class="log-line">${formatLogLine(line)}</div>`).join('');
                if (autoScroll) {
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }
        } catch (e) {
            console.error('Failed to fetch logs');
        }
    }

    setInterval(fetchProgress, 3000);
    setInterval(fetchLogs, 3000);
    
    fetchProgress();
    fetchLogs();
</script>

</body>
</html>
