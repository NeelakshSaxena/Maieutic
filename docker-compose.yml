version: '3.8'

services:
  maieutic:
    build: .
    container_name: maieutic_app
    ports:
      - "3000:3000"
      - "8000:8000"
      - "11434:11434"
      - "6333:6333"
    volumes:
      - postgres_data:/workspace/postgres/data
      - ollama_data:/workspace/ollama
      - qdrant_data:/workspace/qdrant
      - redis_data:/workspace/redis
    environment:
      - OLLAMA_MODEL=qwen2
      - LLM_API_KEY=${LLM_API_KEY:-}

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  redis_data:
