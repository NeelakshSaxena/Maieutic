[tool.poetry]
name = "api"
version = "0.1.0"
description = "MentorAI FastAPI Backend"
authors = ["Neelaksh Saxena"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.29"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
qdrant-client = "^1.8.0"
redis = "^5.0.3"
httpx = "^0.27.0"
openai = "^1.16.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
